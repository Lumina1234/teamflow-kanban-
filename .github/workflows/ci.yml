name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kanban_test
          POSTGRES_PASSWORD: kanban_test_password
          POSTGRES_DB: kanban_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt
      
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt
      
      - name: Run tests
        # conftest.py uses Base.metadata.create_all/drop_all directly —
        # no separate alembic step needed for the test DB.
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://kanban_test:kanban_test_password@localhost:5432/kanban_test_db
          TEST_DATABASE_URL: postgresql+asyncpg://kanban_test:kanban_test_password@localhost:5432/kanban_test_db
          SESSION_SECRET_KEY: test-secret-key-32-chars-minimum-!
          REDIS_URL: redis://localhost:6379
          ALLOWED_ORIGINS: http://localhost:5173
          COOKIE_SECURE: "false"
          ENVIRONMENT: test
        run: pytest tests/ -v --cov=app --cov-report=term-missing
      
      - name: Lint with ruff
        working-directory: backend
        run: |
          pip install ruff
          ruff check app/ --select=E,F,W --ignore=E501

  frontend-tests:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      
      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8000
        run: npm run build

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
